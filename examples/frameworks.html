<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serviceform AgenticSearch next to a CSS framework</title>
<link rel="stylesheet" href="../packages/agenticsearch/dist/agenticsearch.min.css">
<!--
  ?tool=TOOL_ID&css=none|bootstrap|tailwind|hostile  (and &api=, &layout=page|box|modal|section)
  The framework's CSS is loaded AFTER the search's own, the worst case for
  conflicts. "hostile" is a made-up theme that styles every plain element the
  way careless themes do. The search should look the same in all four.
-->
<script>
  const params = new URLSearchParams(location.search);
  const css = params.get('css') || 'none';
  if (css === 'bootstrap') document.write('<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">');
  if (css === 'tailwind') document.write('<script src="https://cdn.tailwindcss.com?plugins=forms,typography"><\/script>');
  if (css === 'hostile') document.write(`<style>
    body { font-family: Georgia, serif; }
    button, input[type="submit"] { background: hotpink; color: #fff; text-transform: uppercase; letter-spacing: 2px; padding: 18px 30px; border: 3px solid purple; border-radius: 0; box-shadow: 4px 4px 0 #000; min-height: 60px; font-weight: 900; }
    button:hover, #page button:hover { background: #000; color: #fff; }
    input[type="search"], input[type="number"], select { border: 3px solid red; padding: 20px; border-radius: 0; background: #ffe; height: 70px; box-shadow: inset 0 0 6px #000; width: 100%; }
    input:focus { outline: 5px dashed orange; box-shadow: 0 0 0 6px lime; }
    a, .entry-content a { color: red; text-decoration: underline wavy; box-shadow: inset 0 -2px 0 red; }
    a:hover { color: blue; }
    svg { fill: currentColor; width: 40px; height: 40px; }
    label { display: block; font-weight: 900; margin-bottom: 20px; text-transform: uppercase; }
    ul, ol { list-style: square; margin: 0 0 30px 40px; padding-left: 40px; }
    li { margin-bottom: 20px; }
    .entry-content li::before { content: ">> "; color: red; }
    img { max-width: 50%; height: auto; border: 4px solid gold; border-radius: 50%; }
    p { margin: 0 0 40px; }
    form { margin: 30px; padding: 20px; background: #eee; border: 1px dashed #999; }
    kbd { background: #000; color: #0f0; }
    b, strong { font-weight: 400; }
    input[type="checkbox"] { appearance: none; width: 40px; height: 40px; border: 3px solid red; }
  </style>`);
</script>
<style>
  .demo-header { display: flex; align-items: center; gap: 24px; padding: 14px 24px; border-bottom: 1px solid #e5e7eb; }
  .demo-header .slot { margin-left: auto; width: 340px; max-width: 45vw; }
  .demo-main { max-width: 1240px; margin: 0 auto; padding: 28px 24px 80px; }
</style>
</head>
<body>
<div id="page" class="entry-content">
  <div class="demo-header"><strong id="label"></strong><div class="slot" id="header-slot"></div></div>
  <div class="demo-main" id="main"></div>
</div>
<script>
  const tool = params.get('tool') || '';
  const layout = params.get('layout') || 'page';
  document.getElementById('label').textContent = 'CSS on this page: ' + css;
  const mountDiv = (attrs) => { const d = document.createElement('div'); d.setAttribute('data-sf-agenticsearch', ''); for (const [k, v] of Object.entries(attrs)) if (v) d.setAttribute('data-' + k, v); return d; };
  if (tool) {
    const base = { 'tool-id': tool, 'api-base': params.get('api') || '', test: 'true' };
    document.getElementById('header-slot').appendChild(mountDiv({ ...base, layout: layout === 'modal' ? 'modal' : 'box' }));
    if (layout === 'page' || layout === 'section') document.getElementById('main').appendChild(mountDiv({ ...base, layout }));
  } else document.getElementById('main').textContent = 'Add ?tool=YOUR_TOOL_ID to the address.';
</script>
<script src="../packages/agenticsearch/dist/agenticsearch.prebuilt.min.js" defer></script>
</body>
</html>
