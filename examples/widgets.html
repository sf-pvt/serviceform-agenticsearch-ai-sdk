<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serviceform AgenticSearch: your own layout from widgets</title>
<link rel="stylesheet" href="../packages/agenticsearch/dist/agenticsearch.min.css">
<style>
  body { margin: 0 auto; max-width: 1100px; padding: 24px; font-family: system-ui, sans-serif; }
  .layout { display: grid; grid-template-columns: 220px 1fr; gap: 24px; margin-top: 20px; }
  .bar { display: flex; align-items: center; gap: 12px; margin: 14px 0; }
  .bar #chips { flex: 1; }
  .mine { display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; align-items: center; padding: 10px; }
  .mine img { width: 72px; height: 54px; object-fit: cover; border-radius: 6px; }
</style>
</head>
<body class="sfas">
<!-- Open with ?tool=TOOL_ID (and &api=https://... to use another Serviceform API host). -->
<div id="searchbox"></div>
<div id="answer"></div>
<div class="bar"><div id="stats"></div><div id="chips"></div><div id="sort"></div></div>
<div class="layout">
  <aside>
    <div id="brand"></div>
    <div id="price"></div>
  </aside>
  <div><div id="hits"></div><div id="pagination"></div></div>
</div>
<script type="module">
  import { serviceformSearch, agenticsearch, searchBox, aiAnswer, stats, currentRefinements, sortBy, refinementList, range, hits, pagination } from '../packages/agenticsearch/dist/index.js';

  const params = new URLSearchParams(location.search);
  const search = agenticsearch({
    searchClient: serviceformSearch(params.get('tool'), { apiBase: params.get('api') || undefined, testMode: true }),
    routing: true,
    perPage: 12,
  });

  search.addWidgets([
    searchBox({ container: '#searchbox' }),
    aiAnswer({ container: '#answer' }),
    stats({ container: '#stats' }),
    currentRefinements({ container: '#chips' }),
    sortBy({ container: '#sort' }),
    refinementList({ container: '#brand', attribute: 'brand', limit: 6 }),
    range({ container: '#price', attribute: 'price' }),
    hits({
      container: '#hits',
      // A card of your own. Return a string (escape what you interpolate) or a DOM node.
      templates: { item: (hit, { escape }) => `<div class="mine"><img src="${escape(hit.image)}" alt=""><div><strong>${escape(hit.title)}</strong><br><small>${escape(hit.meta || '')}</small></div><b>${escape(hit.price)}</b></div>` },
    }),
    pagination({ container: '#pagination' }),
  ]);
  search.start();
</script>
</body>
</html>
